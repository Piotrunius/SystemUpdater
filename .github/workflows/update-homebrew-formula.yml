name: Release & Homebrew Tap

on:
  push:
    branches:
      - main
    paths-ignore:
      - Formula/systemupdater.rb
      - README.md
      - .gitignore

permissions:
  contents: write

concurrency:
  group: release-and-tap
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next SemVer version
        id: version
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.2.2")"
          export CUR_VER="${latest_tag#v}"

          python3 - <<'PY'
          import os
          import re

          cur_ver = os.environ.get("CUR_VER", "1.2.2")
          subject = os.environ.get("COMMIT_SUBJECT", "")

          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", cur_ver)
          if not m:
              raise SystemExit(f"Invalid SemVer format: {cur_ver}")

          major, minor, patch = map(int, m.groups())

          is_major = bool(re.search(r"^[a-zA-Z]+(\([^\)]+\))?!:", subject)) or "BREAKING CHANGE:" in subject or "BREAKING-CHANGE:" in subject
          is_minor = bool(re.search(r"^feat(\([^\)]+\))?:", subject))

          if is_major:
              major += 1
              minor = 0
              patch = 0
          elif is_minor:
              minor += 1
              patch = 0
          else:
              patch += 1

          next_ver = f"{major}.{minor}.{patch}"
          print(f"Calculated next version: {next_ver} (from {cur_ver})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={next_ver}\n")
              f.write(f"tag=v{next_ver}\n")
          PY

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Calculate release archive checksum
        id: checksum
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"

          sha=""
          for i in {1..12}; do
            if sha=$(curl -fsSL "${archive_url}" | sha256sum | cut -d' ' -f1); then
              if [ -n "$sha" ] && [ "${#sha}" -eq 64 ]; then
                break
              fi
            fi
            sleep 2
          done

          if [ -z "$sha" ] || [ "${#sha}" -ne 64 ]; then
            echo "Failed to fetch archive or compute sha256: ${archive_url}" >&2
            exit 1
          fi

          echo "Archive URL: ${archive_url}"
          echo "SHA256: ${sha}"
          echo "archive_url=${archive_url}" >> "$GITHUB_OUTPUT"
          echo "archive_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula in tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_URL: ${{ steps.checksum.outputs.archive_url }}
          ARCHIVE_SHA: ${{ steps.checksum.outputs.archive_sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "TAP_DEPLOY_KEY is not set; skipping tap formula update."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "${TAP_DEPLOY_KEY}" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:Piotrunius/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          mkdir -p Formula
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          url = os.environ["ARCHIVE_URL"]
          sha = os.environ["ARCHIVE_SHA"]
          version = os.environ["VERSION"]
          v_ver = '#{version}'
          v_py = '#{python}'
          v_lib = '#{libexec}'
          v_bin = '#{bin}'

          content = textwrap.dedent(f"""\
            class Systemupdater < Formula
              desc "Unified update runner for Linux package managers and dev tools"
              homepage "https://github.com/Piotrunius/SystemUpdater"
              url "{url}"
              sha256 "{sha}"
              version "{version}"
              license "MIT"

              depends_on :linux
              depends_on "python@3"

              def install
                libexec.install Dir["*.py"]
                libexec.install "modules"
                (libexec/".homebrew-install").write("homebrew\\n")
                (libexec/"VERSION").write("{v_ver}\\n")

                python = Formula["python@3"].opt_bin/"python3"
                (bin/"sysupdate").write <<~EOS
                  #!/bin/bash
                  exec "{v_py}" "{v_lib}/main.py" "$@"
                EOS
              end

              test do
                output = shell_output("{v_bin}/sysupdate --version")
                assert_match "Installed version: {v_ver}", output
              end
            end
          """)
          Path("Formula/systemupdater.rb").write_text(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/systemupdater.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
          else
            git commit -m "chore(formula): bump systemupdater to ${VERSION}"
            git push origin main
          fi
