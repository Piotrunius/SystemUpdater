name: Update Homebrew formula

on:
  push:
    branches:
      - main
    paths-ignore:
      - Formula/systemupdater.rb

permissions:
  contents: write

concurrency:
  group: update-homebrew-formula
  cancel-in-progress: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Calculate source archive checksum and next SemVer version
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/${SOURCE_SHA}.tar.gz"
          archive_sha="$(curl --fail --silent --show-error --location "${archive_url}" | sha256sum | cut -d ' ' -f 1)"

          # Read current version strictly from Formula/systemupdater.rb
          current_ver="$(grep -m1 -oE 'version "[0-9]+\.[0-9]+\.[0-9]+"' Formula/systemupdater.rb | cut -d'"' -f2)"
          if [ -z "${current_ver}" ]; then
            echo "Error: Could not read current version from Formula/systemupdater.rb" >&2
            exit 1
          fi

          # Inspect commit message for SemVer bump type
          commit_subject="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"

          export ARCHIVE_URL="${archive_url}"
          export ARCHIVE_SHA="${archive_sha}"
          export CURRENT_VER="${current_ver}"
          export COMMIT_SUBJECT="${commit_subject}"
          export COMMIT_BODY="${commit_body}"

          python3 - <<'PY'
          import re, sys, os

          cur_ver = os.environ["CURRENT_VER"]
          subject = os.environ.get("COMMIT_SUBJECT", "")
          body = os.environ.get("COMMIT_BODY", "")
          full_commit = f"{subject}\n{body}"

          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", cur_ver)
          if not m:
              raise SystemExit(f"Invalid SemVer format in Formula: {cur_ver}")

          major, minor, patch = map(int, m.groups())

          # Check for Breaking Change (MAJOR)
          is_major = (
              bool(re.search(r"^[a-zA-Z]+(\([^\)]+\))?!:", subject))
              or "BREAKING CHANGE:" in full_commit
              or "BREAKING-CHANGE:" in full_commit
          )
          # Check for Feature (MINOR)
          is_minor = bool(re.search(r"^feat(\([^\)]+\))?:", subject))

          if is_major:
              major += 1
              minor = 0
              patch = 0
          elif is_minor:
              minor += 1
              patch = 0
          else:
              # Any other commit (fix, chore, style, refactor, perf, docs, etc.) is a PATCH
              patch += 1

          next_ver = f"{major}.{minor}.{patch}"
          print(f"Calculated next version: {next_ver} (from {cur_ver})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"archive_url={os.environ['ARCHIVE_URL']}\n")
              f.write(f"archive_sha={os.environ['ARCHIVE_SHA']}\n")
              f.write(f"formula_version={next_ver}\n")
          PY

      - name: Update formula metadata
        env:
          ARCHIVE_URL: ${{ steps.source.outputs.archive_url }}
          ARCHIVE_SHA: ${{ steps.source.outputs.archive_sha }}
          FORMULA_VERSION: ${{ steps.source.outputs.formula_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/systemupdater.rb")
          content = formula.read_text()
          replacements = (
              (r'(?m)^  url ".*"$', f'  url "{os.environ["ARCHIVE_URL"]}"'),
              (r'(?m)^  sha256 ".*"$', f'  sha256 "{os.environ["ARCHIVE_SHA"]}"'),
              (r'(?m)^  version ".*"$', f'  version "{os.environ["FORMULA_VERSION"]}"'),
          )
          for pattern, replacement in replacements:
              content, count = re.subn(pattern, replacement, content, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update formula field: {pattern}")
          formula.write_text(content)
          PY

      - name: Commit formula update
        env:
          FORMULA_VERSION: ${{ steps.source.outputs.formula_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/systemupdater.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(homebrew): bump formula to ${FORMULA_VERSION}"
          git push origin HEAD:main
