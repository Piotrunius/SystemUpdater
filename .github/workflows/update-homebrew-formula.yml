name: Release & Homebrew Tap

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .gitignore

permissions:
  contents: write

concurrency:
  group: release-and-tap
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next SemVer version
        id: version
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.2.4")"
          export CUR_VER="${latest_tag#v}"
          export PREV_TAG="${latest_tag}"

          python3 - <<'PY'
          import os
          import re

          cur_ver = os.environ.get("CUR_VER", "1.2.4")
          prev_tag = os.environ.get("PREV_TAG", "v1.2.4")
          subject = os.environ.get("COMMIT_SUBJECT", "")

          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", cur_ver)
          if not m:
              raise SystemExit(f"Invalid SemVer format: {cur_ver}")

          major, minor, patch = map(int, m.groups())

          is_major = bool(re.search(r"^[a-zA-Z]+(\([^\)]+\))?!:", subject)) or "BREAKING CHANGE:" in subject or "BREAKING-CHANGE:" in subject
          is_minor = bool(re.search(r"^feat(\([^\)]+\))?:", subject))

          if is_major:
              major += 1
              minor = 0
              patch = 0
          elif is_minor:
              minor += 1
              patch = 0
          else:
              patch += 1

          next_ver = f"{major}.{minor}.{patch}"
          print(f"Calculated next version: {next_ver} (from {cur_ver})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prev_tag={prev_tag}\n")
              f.write(f"version={next_ver}\n")
              f.write(f"tag=v{next_ver}\n")
          PY

      - name: Create GitHub Release with Detailed Changelog
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          prev_tag = os.environ.get("PREV_TAG", "")
          tag = os.environ.get("TAG", "")
          repo = os.environ.get("REPOSITORY", "")

          rev_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD"
          try:
              commits_raw = subprocess.check_output(
                  ["git", "log", rev_range, "--pretty=format:COMMIT_START%n%H%n%s%n%b%nCOMMIT_END"],
                  text=True
              )
          except subprocess.CalledProcessError:
              commits_raw = subprocess.check_output(
                  ["git", "log", "-n", "1", "--pretty=format:COMMIT_START%n%H%n%s%n%b%nCOMMIT_END"],
                  text=True
              )

          category_map = {
              "feat": "Features",
              "fix": "Bug Fixes",
              "refactor": "Refactoring",
              "perf": "Performance Improvements",
              "docs": "Documentation",
              "chore": "Maintenance",
              "ci": "CI / CD",
              "style": "Code Style",
              "test": "Testing",
          }

          categorized = {}
          breaking = []

          for block in commits_raw.split("COMMIT_START\n"):
              if not block.strip():
                  continue
              parts = block.split("\nCOMMIT_END")[0].strip().split("\n")
              if len(parts) < 2:
                  continue
              sha = parts[0][:12]
              subject = parts[1].strip()
              body = "\n".join(parts[2:]).strip() if len(parts) > 2 else ""

              m = re.match(r"^([a-zA-Z]+)(?:\(([^\)]+)\))?(!)?:\s*(.+)$", subject)
              is_breaking = "BREAKING CHANGE:" in body or "BREAKING-CHANGE:" in body or (m and m.group(3) == "!")

              if m:
                  ctype = m.group(1).lower()
                  scope = m.group(2)
                  desc = m.group(4)
                  type_title = category_map.get(ctype, ctype.capitalize())
              else:
                  type_title = "Other Changes"
                  scope = None
                  desc = subject

              entry = {
                  "sha": sha,
                  "subject": subject,
                  "desc": desc,
                  "scope": scope,
                  "body": body,
              }

              if is_breaking:
                  breaking.append(entry)
              categorized.setdefault(type_title, []).append(entry)

          lines = []
          if breaking:
              lines.append("### Breaking Changes\n")
              for b in breaking:
                  scope_str = f"**{b['scope']}:** " if b['scope'] else ""
                  lines.append(f"- {scope_str}{b['desc']} (`{b['sha']}`)")
                  if b['body']:
                      for l in b['body'].splitlines():
                          l_str = l.strip()
                          if l_str.startswith("- "):
                              lines.append(f"  {l_str}")
              lines.append("")

          order = [
              "Features",
              "Bug Fixes",
              "Performance Improvements",
              "Refactoring",
              "Documentation",
              "CI / CD",
              "Maintenance",
              "Code Style",
              "Testing",
              "Other Changes",
          ]
          for cat in order:
              if cat in categorized:
                  lines.append(f"### {cat}\n")
                  for item in categorized[cat]:
                      scope_str = f"**{item['scope']}:** " if item['scope'] else ""
                      lines.append(f"- {scope_str}{item['desc']} (`{item['sha']}`)")
                      if item['body']:
                          for l in item['body'].splitlines():
                              l_str = l.strip()
                              if l_str.startswith("- "):
                                  lines.append(f"  {l_str}")
                              elif l_str and not l_str.startswith("BREAKING"):
                                  lines.append(f"  > {l_str}")
                  lines.append("")

          if prev_tag and repo:
              lines.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          notes_content = "\n".join(lines).strip()
          Path("/tmp/release_notes.md").write_text(notes_content + "\n")
          PY

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release_notes.md \
            --target "${{ github.sha }}"

      - name: Calculate release archive checksum
        id: checksum
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"

          sha=""
          for i in {1..12}; do
            if sha=$(curl -fsSL "${archive_url}" | sha256sum | cut -d' ' -f1); then
              if [ -n "$sha" ] && [ "${#sha}" -eq 64 ]; then
                break
              fi
            fi
            sleep 2
          done

          if [ -z "$sha" ] || [ "${#sha}" -ne 64 ]; then
            echo "Failed to fetch archive or compute sha256: ${archive_url}" >&2
            exit 1
          fi

          echo "Archive URL: ${archive_url}"
          echo "SHA256: ${sha}"
          echo "archive_url=${archive_url}" >> "$GITHUB_OUTPUT"
          echo "archive_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula in tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_URL: ${{ steps.checksum.outputs.archive_url }}
          ARCHIVE_SHA: ${{ steps.checksum.outputs.archive_sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "TAP_DEPLOY_KEY is not set; skipping tap formula update."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "${TAP_DEPLOY_KEY}" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:Piotrunius/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          mkdir -p Formula
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          url = os.environ["ARCHIVE_URL"]
          sha = os.environ["ARCHIVE_SHA"]
          version = os.environ["VERSION"]
          v_ver = '#{version}'
          v_py = '#{python}'
          v_lib = '#{libexec}'
          v_bin = '#{bin}'

          content = textwrap.dedent(f"""\
            class Systemupdater < Formula
              desc "Unified update runner for Linux and macOS package managers and dev tools"
              homepage "https://github.com/Piotrunius/SystemUpdater"
              url "{url}"
              sha256 "{sha}"
              version "{version}"
              license "MIT"

              depends_on "python@3"

              def install
                libexec.install Dir["*.py"]
                libexec.install "modules"
                (libexec/".homebrew-install").write("homebrew\\n")
                (libexec/"VERSION").write("{v_ver}\\n")

                python = Formula["python@3"].opt_bin/"python3"
                (bin/"sysupdate").write <<~EOS
                  #!/bin/bash
                  exec "{v_py}" "{v_lib}/main.py" "$@"
                EOS
              end

              test do
                output = shell_output("{v_bin}/sysupdate --version")
                assert_match "Installed version: {v_ver}", output
              end
            end
          """)
          Path("Formula/systemupdater.rb").write_text(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/systemupdater.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
          else
            git commit -m "chore(formula): bump systemupdater to ${VERSION}"
            git push origin main
          fi
